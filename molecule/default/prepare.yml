---
- name: Prepare I hate money Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Ensure apt cache is updated for I hate money Molecule tests preparation
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 600
      when: ansible_facts["os_family"] == 'Debian'

    - name: Ensure required packages are installed for I hate money Molecule tests preparation
      ansible.builtin.package:
        name:
          - python3-requests
          # The storage driver below. Docker in a container cannot use the
          # host's overlayfs, and fuse-overlayfs is several times faster than
          # falling back to vfs.
          - fuse-overlayfs
        state: present

    - name: Ensure Docker is installed for I hate money Molecule tests preparation
      ansible.builtin.include_role:
        name: ansible-role-docker
      vars:
        docker_daemon_options:
          # `vfs` makes a full copy of every layer. The I hate money image is large
          # enough for that to dominate the run - `fuse-overlayfs` gives the same
          # nested-container isolation without the copying.
          storage-driver: fuse-overlayfs

    - name: Ensure the directory bind-mounted into the I hate money container exists
      ansible.builtin.file:
        path: "{{ ihatemoney_molecule_extra_mount_path_host }}"
        state: directory
        mode: "0755"

    - name: Ensure the marker file inside the bind-mounted directory exists
      ansible.builtin.copy:
        content: "{{ ihatemoney_molecule_extra_mount_marker }}\n"
        dest: "{{ ihatemoney_molecule_extra_mount_path_host }}/marker"
        mode: "0644"
